[package]
name = "photocraft-algo"
description = "Depth-agnostic, tile-aware CPU image filters (blur, sharpen, noise, distort, stylize)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-raster = { workspace = true }
serde = { workspace = true }
rustfft = "6.4.1"

# Parallel tiles on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[features]
corpus = []

[dev-dependencies]
flate2 = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-cms = { workspace = true }
serde_json = { workspace = true }

sha2 = "0.10"
