[package]
name = "photocraft-genai-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# Standalone: excluded from the photocraft workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
photocraft-genai = { path = ".." }

[[bin]]
name = "openai"
path = "fuzz_targets/openai.rs"
test = false
doc = false
bench = false
