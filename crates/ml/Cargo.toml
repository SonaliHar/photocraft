[package]
name = "photocraft-ml"
description = "Learned-model inference for PhotoCraft: SAM 2 promptable segmentation through ONNX Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
# Result archives from the remote service (pure Rust, deflate only).
zip = { version = "9", default-features = false, features = ["deflate"] }

# ONNX Runtime is loaded at run time (`ORT_DYLIB_PATH` or the assets folder), so builds need no
# native download and a machine without it simply falls back to the classical algorithms.
# Native only: wasm builds compile the stub in `sam2.rs`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-24", "cuda"] }

# Optional remote providers (see `remote.rs`): a small blocking HTTPS client.
ureq = { version = "3", default-features = false, features = ["rustls"] }
